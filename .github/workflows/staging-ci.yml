name: Pre-Release

# Filename stays staging-ci.yml; staging-to-main-promotion.yml's workflow_run trigger
# references this display name ("Pre-Release"), not the filename - keep both in sync.

on:
  push:
    branches:
      - staging

concurrency:
  group: staging-ci
  cancel-in-progress: true

permissions:
  contents: write
  checks: write

jobs:
  detect-backmerge:
    # On a push event HEAD is the pushed commit itself, so this mainly catches the case where
    # the automated back-merge PR (main -> staging) was merged with "Create a merge commit",
    # making main's tip a direct parent of the new staging HEAD.
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether this push is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    # Hybrid job model: runs in parallel with build-and-test (no `needs:` between them), so a
    # format/security/analyzer failure is visible without waiting for the test run.
    # Windows runner: the MAUI app targets net10.0-windows only, which cannot be restored or
    # built on Linux.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        uses: ./.github/actions/setup-maui-workload

      - name: Restore dependencies
        run: dotnet restore FlowNRW.sln
        shell: pwsh

      - name: Format check
        # Gate 1. --severity error restricts this to whitespace/style plus genuine analyzer
        # errors; warning-level analyzer diagnostics are Gate 3's concern.
        run: dotnet format FlowNRW.sln --verify-no-changes --no-restore --severity error
        shell: pwsh

      - name: Security scan
        # Gate 2 - shared composite action, see .github/actions/security-scan.
        uses: ./.github/actions/security-scan
        with:
          solution-path: FlowNRW.sln
          artifact-name: vulnerable-packages-staging

      - name: Static analysis
        # Gate 3: the whole solution (including the MAUI app) must build warning-free.
        run: dotnet build FlowNRW.sln -c Release --no-restore "-p:TreatWarningsAsErrors=true"
        shell: pwsh

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    # Only the platform-independent projects (FlowNRW.Core, FlowNRW.Tests) are built here, so
    # this job needs neither Windows nor the MAUI workload and stays fast.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FlowNRW.Tests/FlowNRW.Tests.csproj

      - name: Build
        run: dotnet build FlowNRW.Tests/FlowNRW.Tests.csproj --no-restore -c Release

      - name: Test
        # Gate 4 (blocking): collects coverage for the threshold below.
        run: >
          dotnet test FlowNRW.Tests/FlowNRW.Tests.csproj --no-build -c Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: reportgenerator "-reports:FlowNRW.Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"

      - name: Enforce coverage threshold
        # Gate 5: hard 70% line-coverage minimum.
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          set -euo pipefail
          summary="coverage-report/Summary.txt"
          if ! grep -q "Line coverage:" "$summary"; then
            echo "Could not determine line coverage from the generated report." >&2
            exit 1
          fi
          coverage="$(grep -m1 "Line coverage:" "$summary" | grep -oE '[0-9]+([.,][0-9]+)?' | head -n1 | tr ',' '.')"
          threshold="$COVERAGE_THRESHOLD"
          echo "Line coverage: ${coverage}% (threshold: ${threshold}%)"
          awk -v cov="$coverage" -v thr="$threshold" 'BEGIN { exit !(cov >= thr) }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-staging
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-staging
          path: FlowNRW.Tests/TestResults/*.trx
          retention-days: 14

  release-scripts-test:
    name: release scripts
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test release scripts
        run: npm run test:release-version

  version:
    name: version
    needs: [detect-backmerge, static-checks, build-and-test, release-scripts-test]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.semver.outputs.changed }}
      version: ${{ steps.semver.outputs.version }}
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
      rc_version: ${{ steps.rc.outputs.rc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        shell: pwsh

      - name: Determine next version
        # release.config.js only lists "main" as a release branch (see that file's own
        # comment); staging is deliberately not a configured prerelease branch there. The
        # --branches override below treats "staging" as a plain release branch for this one
        # dry-run only, so the resulting X.Y.Z carries no prerelease identifier - the RC
        # suffix is appended manually in the next step instead.
        id: semver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $output = & npx semantic-release --dry-run --no-ci --branches staging 2>&1 | Out-String
          Write-Host "semantic-release output:"
          Write-Host $output

          $version = $null
          $changed = $false
          if ($output -match 'The next release version is ([0-9]+\.[0-9]+\.[0-9]+(?:[-+][^\s]+)?)') {
            $version = $Matches[1]
            $changed = $true
            Write-Host "Next release version: $version"
          } else {
            Write-Host "No new release version determined."
          }

          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          "changed=$($changed.ToString().ToLowerInvariant())" | Add-Content -Path $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Determine RC number
        if: steps.semver.outputs.changed == 'true'
        id: rc
        shell: pwsh
        run: |
          $version = "${{ steps.semver.outputs.version }}"
          $existing = @(git tag --list "v$version-rc.*")
          $rcNumber = $existing.Count + 1
          "rc_number=$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT
          "rc_tag=v$version-rc.$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT
          # RC-suffixed version without the leading "v" (e.g. "1.2.3-rc.1"), distinct from
          # rc_tag ("v1.2.3-rc.1"). Passed as build-and-package's release-version input so
          # both the packaged asset file name and update.json's own "version" field carry
          # the RC suffix.
          "rc_version=$version-rc.$rcNumber" | Add-Content -Path $env:GITHUB_OUTPUT

  prerelease:
    name: prerelease
    needs: [detect-backmerge, version]
    if: needs.detect-backmerge.outputs.is_backmerge != 'true' && needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate release notes for update manifest
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="${{ needs.version.outputs.rc_tag }}"
          $notes = ($json | ConvertFrom-Json).body
          $notesPath = Join-Path $PWD "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          "notes_path=release-notes.md" | Add-Content -Path $env:GITHUB_OUTPUT

          $delimiter = "NOTES_EOF_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes<<$delimiter"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $notes
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delimiter
        shell: pwsh

      - name: Build and package release candidate
        id: build
        uses: ./.github/actions/build-and-package
        with:
          release-version: ${{ needs.version.outputs.rc_version }}
          release-tag: ${{ needs.version.outputs.rc_tag }}
          release-notes: ${{ steps.notes.outputs.notes }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATHS: ${{ steps.build.outputs.asset-paths }}
          RELEASE_MANIFEST_PATH: ${{ steps.build.outputs.manifest-path }}
        run: |
          $tag = "${{ needs.version.outputs.rc_tag }}"
          $assets = @($env:RELEASE_ASSET_PATHS -split ';') + @($env:RELEASE_MANIFEST_PATH)
          gh release create $tag @assets `
            --target $env:GITHUB_SHA `
            --title $tag `
            --prerelease `
            --notes-file "${{ steps.notes.outputs.notes_path }}"
        shell: pwsh

  back-merge-skip:
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Back-merge detected
        run: echo "Back-merge from main detected. Redundant checks are skipped."
