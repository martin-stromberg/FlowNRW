name: Weekly NuGet Review

# Creates the weekly NuGet package review issue requested in issue #20. The
# shared composite action .github/actions/create-review-issue skips creation
# while an open issue of the same type (label `automated-review-nuget`,
# fallback: title-prefix search) still exists, so at most one open review
# issue is present at any time.
#
# Note: `schedule` and `workflow_dispatch` only work once this file exists on
# the default branch (main); until then the workflow stays inactive.

"on":
  schedule:
    # Every Monday at 05:00 UTC (one hour after the weekly security scan to
    # spread runner load).
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: review-nuget-weekly
  cancel-in-progress: false

jobs:
  create-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create NuGet review issue
        uses: ./.github/actions/create-review-issue
        with:
          label: automated-review-nuget
          title-prefix: NuGet-Prüfung
          title-date-format: yyyy-MM-dd
          body-file: .github/review-bodies/nuget-weekly.md
          gh-token: ${{ github.token }}
