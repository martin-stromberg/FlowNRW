name: Yearly Compliance Review

# Creates the yearly compliance and copyright review issue requested in issue
# #20. The shared composite action .github/actions/create-review-issue skips
# creation while an open issue of the same type (label
# `automated-review-compliance`, fallback: title-prefix search) still exists,
# so at most one open review issue is present at any time.
#
# Note: `schedule` and `workflow_dispatch` only work once this file exists on
# the default branch (main); until then the workflow stays inactive.

"on":
  schedule:
    # January 1st at 05:00 UTC.
    - cron: '0 5 1 1 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: review-compliance-yearly
  cancel-in-progress: false

jobs:
  create-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create compliance review issue
        uses: ./.github/actions/create-review-issue
        with:
          label: automated-review-compliance
          title-prefix: Compliance- und Copyright-Review
          title-date-format: yyyy
          body-file: .github/review-bodies/compliance-yearly.md
          gh-token: ${{ github.token }}
