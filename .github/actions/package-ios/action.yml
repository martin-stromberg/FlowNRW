name: Package iOS

inputs:
  release-version:
    description: Version without a leading v, passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1). Kept for a stable call signature across the packaging actions.
    required: true
  codesign-key:
    description: iOS signing identity passed as -p:CodesignKey (e.g. Apple Distribution), provided by the caller from repository secrets.
    required: false
    default: ''
  provisioning-profile:
    description: iOS provisioning profile passed as -p:CodesignProvision, provided by the caller from repository secrets.
    required: false
    default: ''
  api-key-id:
    description: App Store Connect API key ID. When set together with api-key-p8/api-issuer-id, the built .ipa is uploaded to TestFlight via iTMSTransporter.
    required: false
    default: ''
  api-issuer-id:
    description: App Store Connect API issuer ID.
    required: false
    default: ''
  api-key-p8:
    description: App Store Connect API private key (.p8 contents), provided by the caller from repository secrets.
    required: false
    default: ''
  certificate-p12-base64:
    description: Base64-encoded .p12 export of the distribution certificate including private key (Keychain Access export).
    required: false
    default: ''
  certificate-p12-password:
    description: Password of the exported .p12.
    required: false
    default: ''
  provisioning-profile-base64:
    description: Base64-encoded .mobileprovision file.
    required: false
    default: ''
  ios-workload-version:
    description: Microsoft.iOS.Sdk pack/manifest version to pin before workload restore. Must be compatible with a release Xcode on the runner - App Store rejects builds from beta Xcode.
    required: false
    default: '27.2.10000'
  maui-workload-version:
    # Ab Xcode 27 ist die UIScene-Lifecycle-Adoption Pflicht - ohne sie
    # stuerzt die App beim Start ab. MAUI adoptiert sie ab SR 11
    # (10.0.110); das maui-Manifest der Linie 10.0.100 endet bei
    # 10.0.110 (kein 10.0.120-Manifest veroeffentlicht) - der Pin
    # entspricht damit dem geforderten Minimum und macht die
    # aufgeloeste maui-Workload-Version deterministisch. Fallback
    # bei Aufloesungsfehler: Band-Default >= 10.0.110.
    description: Microsoft.NET.Sdk.Maui manifest version to pin in the workload rollback file. Must be >= 10.0.110 (UIScene lifecycle adoption required by Xcode 27 builds).
    required: false
    default: '10.0.110'

runs:
  using: composite
  steps:
    # SDK-Band 10.0.1xx: iOS-Workload-Manifeste werden ausschliesslich
    # als microsoft.net.sdk.ios.manifest-10.0.100 publiziert -
    # manifest-10.0.400-Pakete existieren nicht, ein Rollback-Pin
    # unter Band 10.0.4xx scheitert deshalb an der Manifest-Aufloesung.
    # Microsoft.iOS.Sdk 27.x erfordert Release-Xcode >= 27 - der App
    # Store akzeptiert keine Beta-Xcode-Builds.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.1xx'

    # global.json nur im CI-Workspace: das Runner-Image bringt zusaetzlich
    # weitere SDKs mit; ohne global.json waehlt der Host-Resolver immer das
    # hoechste installierte SDK (z. B. ein 11.x des Images) und das
    # Workload-Band waere nicht mehr die Manifest-Linie 10.0.100, auf
    # der die iOS-/MAUI-Manifeste tatsaechlich publiziert werden.
    # Die Datei wird absichtlich nicht committed - lokal darf jede
    # 10.0.x-SDK verwendet werden.
    - name: Pin SDK band for this job
      run: |
        printf '{"sdk":{"version":"10.0.100","rollForward":"latestPatch","allowPrerelease":false}}\n' > global.json
        dotnet --version
      shell: bash

    # Explizite Xcode-Auswahl: der Image-Default des xcode-27-Runners
    # (aktuell 27.1) driftet mit Image-Updates. Der Pin haelt das Paar
    # Xcode <-> Microsoft.iOS.Sdk-Version konsistent; schlaegt die Auswahl
    # fehl, bricht der Job hier ab statt still gegen ein aelteres SDK
    # zu bauen.
    - name: Select Xcode
      run: |
        set -euo pipefail
        sudo xcode-select -s /Applications/Xcode_27.2.app
        xcode-select -p
        xcodebuild -version
      shell: bash

    # Workload-Versionen pinnen: 'workload restore' aktualisiert die
    # Manifeste immer auf 'latest' und wuerde den Pin wieder
    # deinstallieren. Deshalb: erst per Rollback-File die Manifeste
    # pinnen - iOS-Pack und MAUI (ab Xcode 27 ist die UIScene-Lifecycle-
    # Adoption aus MAUI >= 10.0.110 Pflicht, sonst Start-Crash) -, dann
    # mit --skip-manifest-update installieren, damit exakt die gepinnten
    # Manifest-Versionen aufgeloest werden. Scheitert das kombinierte
    # Update, wird einmal wiederholt (transiente Fehler) und danach nur
    # der iOS-Pin aktualisiert - MAUI faellt auf den Band-Default. Die
    # aufgeloeste MAUI-Version wird in jedem Fall gegen >= 10.0.110
    # verifiziert (Pin und Band-Default gleichermassen).
    - name: Install .NET MAUI workload
      run: |
        set -euo pipefail
        IOS_PIN="${{ inputs.ios-workload-version }}"
        MAUI_PIN="${{ inputs.maui-workload-version }}"
        printf '{"microsoft.net.sdk.ios": "%s", "microsoft.net.sdk.maui": "%s"}\n' \
          "$IOS_PIN" "$MAUI_PIN" \
          > "$RUNNER_TEMP/workload-rollback.json"
        if ! dotnet workload update --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"; then
          # Ursache unklar: iOS-Pin, MAUI-Pin oder transienter Fehler.
          # Einmal kombiniert wiederholen (transiente NuGet-Fehler), dann
          # nur mit dem iOS-Pin aktualisieren - MAUI loest zum
          # Band-Default auf (unten gegen >= 10.0.110 verifiziert).
          echo "::warning::Kombiniertes Rollback-Update fehlgeschlagen (iOS-Pin '$IOS_PIN', MAUI-Pin '$MAUI_PIN' oder transienter Fehler) - Retry."
          if ! dotnet workload update --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"; then
            echo "::warning::Kombiniertes Rollback-Update weiterhin fehlgeschlagen - versuche nur mit iOS-Pin."
            printf '{"microsoft.net.sdk.ios": "%s"}\n' "$IOS_PIN" \
              > "$RUNNER_TEMP/workload-rollback.json"
            if ! dotnet workload update --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"; then
              echo "::error::Rollback-Update scheitert auch nur mit dem iOS-Pin - iOS-Pin '$IOS_PIN' nicht aufloesbar oder anhaltender NuGet-/Netzwerkfehler."
              exit 1
            fi
            # Der iOS-Pin allein loest auf - das kombinierte Scheitern
            # geht damit auf den MAUI-Pin zurueck; MAUI faellt auf den
            # Band-Default (unten verifiziert).
            echo "::warning::MAUI-Pin '$MAUI_PIN' nicht aufloesbar - Fallback auf den Band-Default (muss >= 10.0.110 sein)."
          fi
        fi
        dotnet workload install maui-ios ios --skip-manifest-update
        # Tatsaechlich aufgeloeste MAUI-Version ermitteln: Spalte
        # "Manifest Version" von 'dotnet workload list' (Format
        # <Version>/<Band>); die Microsoft.Maui.*-Packversion entspricht
        # der Manifestversion. Bei aufgeloestem Pin ist das der Pin, im
        # Fallback der Band-Default - die Pack-Bereinigung unten muss
        # genau diese Version behalten, sonst loescht sie die benoetigten
        # Packs.
        WORKLOAD_LIST="$(dotnet workload list)"
        echo "$WORKLOAD_LIST"
        RESOLVED_MAUI="$(printf '%s\n' "$WORKLOAD_LIST" | awk '$1 == "maui-ios" { v = $2 } END { sub(/\/.*/, "", v); print v }')"
        if [ -z "$RESOLVED_MAUI" ]; then
          echo "::error::Aufgeloeste MAUI-Workload-Version konnte nicht aus 'dotnet workload list' ermittelt werden."
          exit 1
        fi
        # >= 10.0.110 gilt unabhaengig vom Aufloesungspfad: auch ein
        # explizit gepinnter maui-workload-version-Input unterhalb des
        # Minimums erzeugt unter Xcode 27 eine App, die beim Start
        # abstuerzt (fehlende UIScene-Lifecycle-Adoption).
        if ! awk -v v="$RESOLVED_MAUI" -v min="10.0.110" \
            'BEGIN { split(v, a, "."); split(min, b, "."); for (i = 1; i <= 3; i++) { if (a[i]+0 > b[i]+0) exit 0; if (a[i]+0 < b[i]+0) exit 1 } exit 0 }'; then
          echo "::error::Aufgeloeste MAUI-Version $RESOLVED_MAUI ist < 10.0.110 - Xcode-27-Builds benoetigen MAUI >= 10.0.110 (UIScene-Lifecycle)."
          exit 1
        fi
        # Auf dem Runner vorinstallierte iOS-/MAUI-Packs anderer Version
        # entfernen: die TPV-Resolution wuerde sonst das neueste Pack
        # waehlen - unabhaengig vom gepinnten Manifest. Bei MAUI wird
        # gegen die aufgeloeste Version geprueft (Pin bzw. Band-Default).
        for d in "$HOME"/.dotnet/packs/Microsoft.iOS.Sdk.net10.0_*/*/; do
          [ -d "$d" ] || continue
          [ "$(basename "$d")" = "$IOS_PIN" ] || rm -rf "$(dirname "$d")"
        done
        for d in "$HOME"/.dotnet/packs/Microsoft.Maui.*/*/; do
          [ -d "$d" ] || continue
          [ "$(basename "$d")" = "$RESOLVED_MAUI" ] || rm -rf "$(dirname "$d")"
        done
      shell: bash

    # -r ios-arm64 ist Pflicht: publish unten laeuft mit
    # --no-restore und braucht das RID-Ziel im assets file.
    - name: Restore
      run: dotnet restore FlowNRW/FlowNRW.csproj -r ios-arm64
      shell: bash

    # Signatur-Material importieren: das Runner-Image hat weder
    # Distribution-Zertifikat noch Provisioning-Profil. Temporaere
    # Keychain mit Zufallspasswort; set-key-partition-list verhindert
    # den GUI-Passwort-Prompt beim Signieren.
    - name: Install signing certificate and provisioning profile
      if: ${{ inputs.certificate-p12-base64 != '' }}
      shell: bash
      env:
        P12_BASE64: ${{ inputs.certificate-p12-base64 }}
        P12_PASSWORD: ${{ inputs.certificate-p12-password }}
        PROFILE_BASE64: ${{ inputs.provisioning-profile-base64 }}
      run: |
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
        rm -f "$RUNNER_TEMP/dist.p12"
        EXISTING=$(security list-keychains -d user | tr -d '"')
        security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
        cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
        rm -f "$RUNNER_TEMP/profile.mobileprovision"
        echo "$KEYCHAIN_PATH" > "$RUNNER_TEMP/keychain-path.txt"
        unset KEYCHAIN_PASSWORD

    # ApplicationDisplayVersion/ApplicationVersion explizit setzen: die
    # csproj pinnt beide fuer lokale Builds. Die Buildnummer ist die
    # Commit-Anzahl - repo-weit monoton, anders als github.run_number,
    # das pro Workflow zaehlt (staging-ci und release wuerden sonst
    # kollidierende CFBundleVersion-Werte erzeugen). run_attempt erhoeht
    # bei Repair-Uploads desselben Commits.
    # ApplicationDisplayVersion akzeptiert nur dreiteilige numerische
    # Versionen - bei Pre-Releases (0.4.0-rc.1) wird der Suffix abgeschnitten
    # (CFBundleShortVersionString muss numerisch sein).
    - name: Publish (ios)
      run: |
        set -euo pipefail
        DISPLAY_VERSION="${{ inputs.release-version }}"
        DISPLAY_VERSION="${DISPLAY_VERSION%%-*}"
        BUILD_NUMBER=$(( $(git rev-list --count HEAD) + ${{ github.run_attempt }} - 1 ))
        dotnet publish FlowNRW/FlowNRW.csproj -p:Version=${{ inputs.release-version }} \
          -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
          -p:ApplicationVersion=$BUILD_NUMBER \
          --configuration Release --framework net10.0-ios \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:ArchiveOnBuild=true \
          -p:CodesignKey="${{ inputs.codesign-key }}" \
          -p:CodesignProvision="${{ inputs.provisioning-profile }}" \
          --no-restore
      shell: bash

    - name: Collect iOS package
      shell: bash
      run: |
        set -euo pipefail
        ipas=()
        while IFS= read -r -d '' file; do
          ipas+=("$file")
        done < <(find FlowNRW/bin/Release -name '*.ipa' -print0 | sort -z)
        if [ "${#ipas[@]}" -eq 0 ]; then
          echo "::error::No .ipa artifact found under FlowNRW/bin/Release after publish."
          exit 1
        fi
        # dotnet publish may write the same artifact to both the RID directory and publish/ — deduplicate by basename.
        distinct=$(printf '%s\n' "${ipas[@]##*/}" | sort -u | wc -l)
        if [ "$distinct" -gt 1 ]; then
          echo "::error::Multiple distinct .ipa artifacts found under FlowNRW/bin/Release; expected exactly one:"
          printf '%s\n' "${ipas[@]##*/}" | sort -u
          exit 1
        fi
        ipa=""
        for f in "${ipas[@]}"; do
          case "$f" in */publish/*) ipa="$f"; break;; esac
        done
        if [ -z "$ipa" ]; then ipa="${ipas[0]}"; fi
        cp "$ipa" release-ios.ipa

    # TestFlight-Upload: laeuft nur, wenn die API-Key-Secrets gesetzt sind.
    # iTMSTransporter liegt auf den Runnern nicht in Transporter.app -
    # gesucht wird in den Apple-Standardorten (gleiche Liste wie
    # Get-TransporterFindScript in scripts/iOS-Deployment.ps1).
    - name: Upload to TestFlight
      if: ${{ inputs.api-key-p8 != '' }}
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.api-key-id }}
        ASC_ISSUER_ID: ${{ inputs.api-issuer-id }}
        ASC_KEY_P8: ${{ inputs.api-key-p8 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        chmod 700 "$HOME/.appstoreconnect/private_keys"
        printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
        # iTMSTransporter finden: Developer/usr/bin (und xcrun) liefern
        # auf aktuellem Xcode nur einen Stub, der 'iTMSTransporter is now
        # part of Transporter' meldet - die echten Orte sind die
        # Transporter.app-Installation und das Standalone-Paket unter
        # /usr/local/itms bzw. das ContentDeliveryServices.framework.
        DEVDIR="$(xcode-select -p 2>/dev/null || true)"
        CANDIDATES=(
          "/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
          "$HOME/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
          "/usr/local/itms/bin/iTMSTransporter"
        )
        if [ -n "$DEVDIR" ]; then
          CANDIDATES+=(
            "$DEVDIR/../SharedFrameworks/ContentDeliveryServices.framework/Versions/A/itms/bin/iTMSTransporter"
          )
        fi
        ITMS=""
        for c in "${CANDIDATES[@]}"; do
          if [ -x "$c" ]; then ITMS="$c"; break; fi
        done
        # Fallback: offizielles Standalone-Paket von Apples CDN
        # installieren (Transporter.app ist auf den Runnern nicht
        # vorinstalliert, Xcode liefert nur den Stub).
        if [ -z "$ITMS" ]; then
          echo "Kein funktionierender iTMSTransporter gefunden - installiere Standalone-Paket ..."
          curl -fsSL "https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/" \
            -o "$RUNNER_TEMP/itmstransporter.pkg"
          sudo installer -pkg "$RUNNER_TEMP/itmstransporter.pkg" -target /
          rm -f "$RUNNER_TEMP/itmstransporter.pkg"
          if [ -x /usr/local/itms/bin/iTMSTransporter ]; then
            ITMS=/usr/local/itms/bin/iTMSTransporter
          fi
        fi
        if [ -z "$ITMS" ]; then
          echo "::error::iTMSTransporter not found on runner (or only the deprecated stub)."
          exit 1
        fi
        echo "Using iTMSTransporter: $ITMS"
        "$ITMS" -m upload -assetFile release-ios.ipa -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"

    # Keychain-Reste entfernen, auch bei Fehlschlag.
    - name: Remove signing keychain
      if: always()
      shell: bash
      run: |
        KEYCHAIN_PATH="$(cat "$RUNNER_TEMP/keychain-path.txt" 2>/dev/null || true)"
        rm -f "$RUNNER_TEMP/keychain-path.txt" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
        if [ -n "$KEYCHAIN_PATH" ]; then
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        fi
